name: Build AforeWeb Dual APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'virtualcam-dual-*'
    paths:
      - 'VirtualCamDual/**'
      - '.github/workflows/build-virtualcam-dual.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: VirtualCamDual
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AforeWebDual-v1.1.0-debug
          path: VirtualCamDual/app/build/outputs/apk/debug/app-debug.apk
