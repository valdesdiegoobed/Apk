name: Build VirtualCam Shizuku Check APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'virtualcam-shizuku-*'
    paths:
      - 'ShizukuCamCheck/**'
      - '.github/workflows/build-shizuku-cam-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: ShizukuCamCheck
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-Shizuku-Check-v1.2.0
          path: ShizukuCamCheck/app/build/outputs/apk/debug/app-debug.apk
