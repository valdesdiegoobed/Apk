name: Compilar PDF VAGUER

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  APK_NAME: PDF-VAGUER-1.0.0.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon

      - name: Preparar APK
        run: cp pdf-vaguer/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PDF-VAGUER-Android
          path: PDF-VAGUER-1.0.0.apk
          if-no-files-found: error
          retention-days: 30
