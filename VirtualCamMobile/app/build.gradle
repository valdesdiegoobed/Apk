plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vaguer.virtualcammobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vaguer.virtualcammobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
